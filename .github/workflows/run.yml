name: Prothom Alo WhatsApp Bot

on:
  schedule:
    - cron: '*/15 * * * *' # Runs automatically every 15 minutes
  workflow_dispatch:       # Lets you click "Run workflow" manually

permissions:
  contents: write          # Allows GitHub to save your login session & news cache

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Packages
        run: npm install

      - name: Run Bot
        run: node index.js

      - name: Save Session & Sent News Cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auth_info_baileys/ sent_cache.json || true
          git diff --staged --quiet || git commit -m "Update session and news cache"
          git push
