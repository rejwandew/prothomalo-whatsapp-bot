name: Prothom Alo WhatsApp Bot

on:
  workflow_dispatch:       # Triggered by cron-job.org or manually

permissions:
  contents: write          # Allows GitHub to save your encrypted session & news cache

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Packages
        run: npm install

      - name: Decrypt WhatsApp Session
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          if [ -f "session.tar.gz.enc" ]; then
            openssl enc -d -aes-256-cbc -salt -pbkdf2 -in session.tar.gz.enc -out session.tar.gz -k "$SESSION_SECRET"
            tar -xzf session.tar.gz
            rm -f session.tar.gz
            echo "✅ Session decrypted!"
          else
            echo "ℹ️ No encrypted session found yet."
          fi

      - name: Run Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node index.js

      - name: Encrypt Session & Save News Cache
        if: always()
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          if [ -d "auth_info_baileys" ]; then
            tar -czf session.tar.gz auth_info_baileys
            openssl enc -e -aes-256-cbc -salt -pbkdf2 -in session.tar.gz -out session.tar.gz.enc -k "$SESSION_SECRET"
            rm -f session.tar.gz
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add session.tar.gz.enc sent_cache.json || true
          git diff --staged --quiet || git commit -m "Update encrypted session and news cache [skip ci]"
          git push
