name: Prothom Alo WhatsApp Bot

on:
  schedule:
    # Runs every 30 minutes, ONLY between 5:00 AM and 11:59 PM (Stops from 12:00 AM to 4:59 AM)
    - cron: '*/30 5-23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Packages
        run: npm install rss-parser pino

      - name: Run Bot
        run: node index.js

      - name: Save Session & Sent News Cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add auth_info_baileys/ sent_cache.json SENT_LOG.md || true
          git diff --staged --quiet || git commit -m "Update session and news cache"
          git push
